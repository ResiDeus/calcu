<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Borinquen OS • Synthwave</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

:root {
  --neon-pink: #ff2a6d;
  --neon-cyan: #05d9e8;
  --neon-purple: #d300c5;
  --neon-orange: #ff6b35;
  --dark: #0a0a1a;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Orbitron', sans-serif;
  background: var(--dark);
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
  position: relative;
}

/* ===== FONDO ANIMADO ===== */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: radial-gradient(ellipse at bottom, #1a0a2e 0%, #0a0a1a 70%);
  overflow: hidden;
}

.stars {
  position: absolute;
  inset: 0;
  background-image: 
    radial-gradient(2px 2px at 20px 30px, #fff, transparent),
    radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
    radial-gradient(1px 1px at 90px 40px, #fff, transparent),
    radial-gradient(2px 2px at 160px 120px, var(--neon-cyan), transparent),
    radial-gradient(1px 1px at 230px 80px, var(--neon-pink), transparent),
    radial-gradient(2px 2px at 300px 150px, #fff, transparent),
    radial-gradient(1px 1px at 400px 200px, #ff6b35, transparent);
  background-size: 450px 250px;
  animation: twinkle 5s ease-in-out infinite alternate;
}

@keyframes twinkle {
  0% { opacity: 0.5; }
  100% { opacity: 1; }
}

.sun {
  position: absolute;
  bottom: 38%;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 200px;
  background: linear-gradient(to bottom, #ffcc00 0%, #ff6b35 30%, #ff2a6d 60%, #d300c5 100%);
  border-radius: 50%;
  box-shadow: 0 0 80px #ff2a6d, 0 0 150px rgba(255,42,109,0.5);
  z-index: 1;
}

.sun::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 55%;
  background: linear-gradient(to bottom, transparent, rgba(10,10,26,0.9));
  border-radius: 0 0 50% 50%;
}

.sun-lines {
  position: absolute;
  bottom: 0;
  left: 10%;
  right: 10%;
  height: 50%;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 12px,
    rgba(10,10,26,0.85) 12px,
    rgba(10,10,26,0.85) 18px
  );
  border-radius: 0 0 50% 50%;
}

.grid-floor {
  position: absolute;
  bottom: 0;
  left: -50%;
  width: 200%;
  height: 55%;
  background: 
    linear-gradient(90deg, rgba(5,217,232,0.25) 1px, transparent 1px),
    linear-gradient(0deg, rgba(5,217,232,0.25) 1px, transparent 1px);
  background-size: 50px 50px;
  transform: perspective(600px) rotateX(65deg);
  transform-origin: bottom center;
  animation: gridMove 6s linear infinite;
  z-index: 2;
}

@keyframes gridMove {
  0% { background-position: 0 0; }
  100% { background-position: 0 50px; }
}

.horizon {
  position: absolute;
  bottom: 38%;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(to right, transparent, var(--neon-cyan), transparent);
  box-shadow: 0 0 20px var(--neon-cyan);
  z-index: 3;
}

/* ===== DISPOSITIVO ===== */
.device {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 370px;
  background: linear-gradient(160deg, #1a1a2e, #0d0d1a);
  border-radius: 40px;
  padding: 14px;
  box-shadow: 
    0 0 0 4px var(--neon-cyan),
    0 0 30px var(--neon-cyan),
    0 0 60px rgba(5,217,232,0.3),
    inset 0 0 40px rgba(0,0,0,0.7);
  animation: framePulse 4s ease-in-out infinite alternate;
}

@keyframes framePulse {
  0% { 
    box-shadow: 0 0 0 4px var(--neon-cyan), 0 0 25px var(--neon-cyan), 0 0 50px rgba(5,217,232,0.3);
  }
  100% { 
    box-shadow: 0 0 0 4px var(--neon-pink), 0 0 30px var(--neon-pink), 0 0 60px rgba(255,42,109,0.4);
  }
}

.notch {
  width: 130px;
  height: 30px;
  background: #000;
  border-radius: 0 0 20px 20px;
  margin: 0 auto 10px;
  position: relative;
}

.notch::after {
  content: '';
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 50px;
  height: 6px;
  background: #222;
  border-radius: 3px;
}

.screen {
  background: rgba(8,8,20,0.92);
  border-radius: 30px;
  min-height: 660px;
  padding: 18px 14px 30px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.status-bar {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--neon-cyan);
  margin-bottom: 20px;
  font-family: 'Share Tech Mono', monospace;
}

.time { font-weight: 700; }

.home-header {
  text-align: center;
  margin-bottom: 30px;
}

.home-header h1 {
  font-size: 1.5rem;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 20px rgba(5,217,232,0.5);
  letter-spacing: 2px;
}

.home-header p {
  font-size: 0.75rem;
  color: #aaa;
  margin-top: 4px;
  font-family: 'Share Tech Mono', monospace;
}

/* Apps Grid */
.apps-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px 16px;
  padding: 10px 8px;
  flex: 1;
}

.app-icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: transform 0.2s;
}

.app-icon:active {
  transform: scale(0.92);
}

.icon-box {
  width: 68px;
  height: 68px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  background: linear-gradient(145deg, #1a1a2e, #0f0f1a);
  border: 2px solid var(--neon-cyan);
  box-shadow: 
    0 0 12px var(--neon-cyan),
    inset 0 0 15px rgba(5,217,232,0.1);
  animation: iconGlow 3s ease-in-out infinite alternate;
  position: relative;
  overflow: hidden;
}

@keyframes iconGlow {
  0% { box-shadow: 0 0 10px var(--neon-cyan), inset 0 0 10px rgba(5,217,232,0.1); border-color: var(--neon-cyan); }
  100% { box-shadow: 0 0 18px var(--neon-pink), inset 0 0 15px rgba(255,42,109,0.15); border-color: var(--neon-pink); }
}

.app-icon:nth-child(2) .icon-box { animation-delay: 0.5s; }
.app-icon:nth-child(3) .icon-box { animation-delay: 1s; }
.app-icon:nth-child(4) .icon-box { animation-delay: 1.5s; }

.app-label {
  font-size: 0.7rem;
  color: #ddd;
  text-align: center;
  max-width: 80px;
  line-height: 1.2;
}

/* Dock */
.dock {
  margin-top: auto;
  background: rgba(0,0,0,0.5);
  border-radius: 22px;
  padding: 12px 16px;
  display: flex;
  justify-content: space-around;
  border: 1px solid rgba(5,217,232,0.3);
  box-shadow: 0 0 20px rgba(5,217,232,0.2);
}

.dock .icon-box {
  width: 56px;
  height: 56px;
  font-size: 24px;
}

/* Coming soon */
.coming {
  opacity: 0.45;
  pointer-events: none;
}

.footer-home {
  text-align: center;
  margin-top: 16px;
  font-size: 0.65rem;
  color: #666;
  font-family: 'Share Tech Mono', monospace;
}
</style>
</head>
<body>
<div class="bg">
  <div class="stars"></div>
  <div class="sun">
    <div class="sun-lines"></div>
  </div>
  <div class="horizon"></div>
  <div class="grid-floor"></div>
</div>

<div class="device">
  <div class="notch"></div>
  <div class="screen">
    <div class="status-bar">
      <span class="time" id="clock">12:00</span>
      <span>5G • 🔋 87%</span>
    </div>

    <div class="home-header">
      <h1>BORINQUEN OS</h1>
      <p>Synthwave Edition • Hecho en PR 🇵🇷</p>
    </div>

    <div class="apps-grid">
      <!-- Calculadora -->
      <div class="app-icon" onclick="openCalc()">
        <div class="icon-box">🧮</div>
        <span class="app-label">Calculadora<br>Serrucho</span>
      </div>

      <!-- Placeholders para futuras apps -->
      <div class="app-icon coming">
        <div class="icon-box">🎵</div>
        <span class="app-label">Radio<br>Isla</span>
      </div>

      <div class="app-icon coming">
        <div class="icon-box">🍔</div>
        <span class="app-label">Foodie<br>PR</span>
      </div>

      <div class="app-icon coming">
        <div class="icon-box">💸</div>
        <span class="app-label">Presupuesto<br>Jíbara</span>
      </div>

      <div class="app-icon coming">
        <div class="icon-box">🌤️</div>
        <span class="app-label">Clima<br>Borinquen</span>
      </div>

      <div class="app-icon coming">
        <div class="icon-box">🎮</div>
        <span class="app-label">Arcade<br>80s</span>
      </div>
    </div>

    <div class="dock">
      <div class="app-icon" onclick="openCalc()">
        <div class="icon-box">🧮</div>
      </div>
      <div class="app-icon coming">
        <div class="icon-box">📱</div>
      </div>
      <div class="app-icon coming">
        <div class="icon-box">⚙️</div>
      </div>
    </div>

    <div class="footer-home">Toca la Calculadora pa' empezar • Más apps coming soon</div>
  </div>
</div>

<script>
// Reloj
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}`;
}
updateClock();
setInterval(updateClock, 10000);

// Abrir calculadora (cambia esto por la URL real cuando la subas)
function openCalc() {
  // Opción 1: si están en la misma carpeta
  window.location.href = 'calculadora.html';
  
  // Opción 2: si quieres abrir en nueva pestaña
  // window.open('calculadora.html', '_blank');
}
</script>
</body>
</html>
